name: validate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate content graph
        run: npm run validate

      - name: Engine tests
        run: npm test
